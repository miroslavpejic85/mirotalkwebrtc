<!doctype html>
<html lang="en">
    <head>
        <title>MiroTalk WebRTC - Forgot Password</title>
        <link rel="apple-touch-icon" href="../Images/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="../Images/favicon.ico" />

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <script src="../js/theme.js"></script>
        <meta name="description" content="MiroTalk WebRTC - Forgot Password" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/common.css" />
        <link rel="stylesheet" href="../css/confirmation.css" />

        <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script async src="../js/stats.js"></script>
        <script defer src="../js/api.js"></script>
        <script defer src="../js/auth-page.js"></script>
        <script defer src="../js/password-forgot.js"></script>
    </head>
    <body class="auth-page">
        <header class="auth-header">
            <a class="auth-brand" href="/" aria-label="Return to home">
                <img id="authBrandLogo" src="../Images/logo.png" alt="MiroTalk logo" />
                <span id="authBrandName">MiroTalk</span>
            </a>
            <button type="button" class="auth-theme" data-theme-toggle aria-label="Switch to light mode">
                <i class="uil uil-sun" aria-hidden="true"></i>
            </button>
        </header>
        <main class="main single-form">
            <div class="signup">
                <form id="forgotPasswordForm" novalidate>
                    <div class="form-icon-circle">
                        <i class="uil uil-envelope-open" aria-hidden="true"></i>
                    </div>
                    <h1>Reset Password</h1>
                    <p class="form-desc">Enter your email address and we'll send you a link to reset your password.</p>
                    <div class="input-group">
                        <i class="uil uil-envelope" aria-hidden="true"></i>
                        <label class="visually-hidden" for="email">Email address</label>
                        <input
                            type="email"
                            name="Email"
                            id="email"
                            placeholder="Email address"
                            autocomplete="email"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        />
                    </div>
                    <p id="formStatus" class="form-status" role="status" aria-live="polite" hidden></p>
                    <button type="submit">
                        <i class="uil uil-message" aria-hidden="true"></i><span>Send Reset Link</span>
                    </button>
                    <a class="back-login" href="/"
                        ><i class="uil uil-arrow-left" aria-hidden="true"></i> Back to Sign in</a
                    >
                </form>
            </div>
        </main>
    </body>
</html>
