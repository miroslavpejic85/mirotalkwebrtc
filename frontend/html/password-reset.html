<!doctype html>
<html lang="en">
    <head>
        <title>MiroTalk WebRTC - Reset Password</title>
        <link rel="apple-touch-icon" href="../Images/apple-touch-icon.png" />
        <link rel="icon" type="image/x-icon" href="../Images/favicon.ico" />

        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <script>
            (() => {
                const mode = localStorage.mode || 'dark';
                document.documentElement.dataset.theme = mode;
            })();
        </script>
        <meta name="description" content="MiroTalk WebRTC - Reset Password" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
        <link rel="stylesheet" href="../css/home.css" />
        <link rel="stylesheet" href="../css/common.css" />
        <link rel="stylesheet" href="../css/confirmation.css" />

        <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script async src="../js/stats.js"></script>
        <script defer src="../js/api.js"></script>
        <script defer src="../js/password-reset.js"></script>
    </head>
    <body>
        <div class="main single-form">
            <div class="signup">
                <form id="resetPasswordForm" novalidate>
                    <div class="form-icon-circle">
                        <i class="uil uil-shield" aria-hidden="true"></i>
                    </div>
                    <h1>New Password</h1>
                    <p class="form-desc">Choose a new password for your account.</p>
                    <p id="formStatus" class="form-status info" role="status" aria-live="polite">
                        Verifying reset link...
                    </p>
                    <div id="resetFields" class="form-fields" hidden>
                        <div class="input-group">
                            <i class="uil uil-lock" aria-hidden="true"></i>
                            <label class="visually-hidden" for="password">New password</label>
                            <input
                                type="password"
                                name="Password"
                                id="password"
                                placeholder="New password"
                                autocomplete="new-password"
                                aria-describedby="passwordRequirements"
                                required
                                minlength="6"
                                maxlength="36"
                            />
                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <i class="uil uil-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="input-group">
                            <i class="uil uil-lock" aria-hidden="true"></i>
                            <label class="visually-hidden" for="confirmPassword">Confirm new password</label>
                            <input
                                type="password"
                                name="Confirm Password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                required
                                minlength="6"
                                maxlength="36"
                            />
                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password"
                                aria-pressed="false"
                            >
                                <i class="uil uil-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p id="passwordRequirements" class="password-requirements">
                            Use 6-36 characters with uppercase, lowercase, a number, and a special character.
                        </p>
                        <button type="submit">
                            <i class="uil uil-check-circle" aria-hidden="true"></i><span>Reset Password</span>
                        </button>
                    </div>
                    <div class="form-links">
                        <a href="/password-forgot"
                            ><i class="uil uil-envelope-redo" aria-hidden="true"></i> Request a new link</a
                        >
                        <a id="signInLink" href="/"
                            ><i class="uil uil-arrow-left" aria-hidden="true"></i> Back to Sign in</a
                        >
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
